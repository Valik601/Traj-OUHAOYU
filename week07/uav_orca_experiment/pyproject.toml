[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uavbench"
version = "1.0.0"
description = "3D VO/RVO/ORCA comparison for 100 spherical UAVs navigating antipodal targets with a mandatory center-region pass"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "psutil>=5.9"]
numba = ["numba>=0.57"]

[project.scripts]
uavbench = "uavbench.cli:main"

[tool.setuptools.packages.find]
include = ["uavbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "bench: performance benchmarks (enable with --bench)",
  "slow: long-running tests",
]
