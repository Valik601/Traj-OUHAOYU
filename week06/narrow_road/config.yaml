# =============================================================================
# Week06 / 窄路相撞实验（人车混行、同一条直路）
# 所有参数集中在此文件；代码不写死任何数值。
# 单位统一为米 (m)、秒 (s)、米/秒 (m/s)、米/秒^2 (m/s^2)。
# =============================================================================

meta:
  name: narrow_road
  version: "1.0"
  seed: 20261023          # 只用于抽取行人初始条件；抽出后对所有情景冻结
  dt_s: 0.05              # 数值积分步长
  t_max_s: 150.0          # 单次仿真最长模拟时间
  record_every_s: 0.1     # 轨迹落盘采样间隔

# -----------------------------------------------------------------------------
# 道路：笛卡尔坐标，x 为沿路方向，y 为横向；路中线 y = 0。
# 行人从左侧(x 小)往 +x 走，车辆从右侧(x 大)往 -x 驶来，二者迎面相遇。
# -----------------------------------------------------------------------------
road:
  x_min_m: 0.0
  x_max_m: 320.0
  widths_m: [4.0, 3.5, 3.0, 2.8]        # 主实验：较宽 / 较窄 / 失败候选
  sweep_widths_m: [2.8, 2.9, 3.0, 3.1, 3.2, 3.5, 4.0]   # 宽度扫描

# -----------------------------------------------------------------------------
# 行人（全向移动体，可前进 / 侧移 / 停止；不允许倒退）
# -----------------------------------------------------------------------------
pedestrians:
  count: 3
  length_m: 0.5          # 沿路方向的身体尺度（用外接圆直径表示）
  width_m: 0.5           # 肩宽
  x_range_m: [10.0, 90.0]
  min_spacing_m: 12.0
  y_range_m: [-0.5, 0.5]     # 初始横向位置（路中线两侧）
  v0_range_mps: [0.9, 1.5]   # 随机期望步速
  # 运动能力
  tau_s: 0.5              # 纵向速度松弛时间
  a_max_mps2: 1.5
  b_comfort_mps2: 2.0
  b_max_mps2: 3.0
  v_max_mps: 1.8
  v_lat_max_mps: 1.0      # 侧移最大速度
  a_lat_max_mps2: 2.0
  tau_lat_s: 0.30         # 侧向速度松弛时间
  k_lat_1ps: 2.0          # 侧向位置误差 -> 侧向期望速度 的增益
  # 交互规则参数（R0/R1 共用）
  d_alert_m: 25.0         # 感知到车辆并开始侧移的纵向净距
  d_wait_m: 5.0           # 纵向净距小于该值进入 WAIT
  c_pass_m: 0.30          # 行人认为“车辆可安全通过”的横向余量（舒适阈值）
  sidestep_speed_factor: 0.85   # 侧移时的前进速度系数
  follow_gap_m: 1.0       # 行人之间的最小跟驰净距
  follow_range_m: 8.0
  follow_width_m: 0.7     # 视为同一纵向队列的横向宽度

# -----------------------------------------------------------------------------
# 车辆（只能沿直路前进 / 减速 / 停车，不可侧移）
# -----------------------------------------------------------------------------
car:
  length_m: 4.5
  width_m: 1.8
  start_x_m: 300.0
  start_speed_mps: 9.0
  y_m: 0.0                # 车辆固定在路中线
  v0_mps: 9.0
  tau_s: 0.4
  a_max_mps2: 2.0
  b_comfort_mps2: 2.5     # 舒适减速度
  b_max_mps2: 6.0         # 紧急制动上限
  d_conflict_m: 30.0      # 对前方行人的感知/限速距离
  d_near_m: 4.0           # 允许通过时，速度压到 v_clear 的位置（车头到行人）
  d_standoff_m: 3.0       # 规则不允许通过时的停车位置（车头到行人身体）
  plan_decel_mps2: 2.0    # 规划减速度（小于舒适减速度，给控制器留跟踪余量）
  g_stop_m: 2.0           # 行人仍在路径内时的最小停车净距（紧急安全下限）
  finish_x_m: -2.25       # 车尾越过 x=0 视为通过

# -----------------------------------------------------------------------------
# 交互规则集
#   R0: 基准规则 = 车辆固定安全余量 + 行人在 WAIT 时完全僵住
#   R1: 修改规则 = 车辆速度相关安全余量（可低速蹭行）+ 行人等待时继续移向路缘
#   A1/A2: 单因素消融，用来判断“到底哪一条规则导致僵持”
# -----------------------------------------------------------------------------
rules:
  R0:
    name: "固定安全余量 + 行人僵住"
    ped_freeze_on_wait: true
    car_clearance: fixed
    car_c_req_m: 0.30
  R1:
    name: "速度相关余量 + 行人等待时侧移出路缘"
    ped_freeze_on_wait: false
    car_clearance: speed
    car_c_min_m: 0.05
    car_c_per_mps: 0.05
  A1:
    name: "只改车（速度相关余量），行人仍僵住"
    ped_freeze_on_wait: true
    car_clearance: speed
    car_c_min_m: 0.05
    car_c_per_mps: 0.05
  A2:
    name: "只改人（等待时侧移到路缘），车仍固定余量"
    ped_freeze_on_wait: false
    car_clearance: fixed
    car_c_req_m: 0.30

# -----------------------------------------------------------------------------
# 两种运动模型（同一 Agent 框架的可插拔控制层）
#   sfm:       社会力模型（Helbing 形式，加速度量纲）
#   wiedemann: Wiedemann 心理-物理阈值模型（跟驰/接近/制动/停车 分regime）
# -----------------------------------------------------------------------------
models:
  sfm:
    car_circles:            # 用三个圆近似车辆矩形，供社会力计算
      radius_m: 0.9
      offsets_m: [-1.35, 0.0, 1.35]
    ped_ped:  {A_mps2: 2.0, B_m: 0.30, aniso_lambda: 0.20}
    ped_car:  {A_mps2: 2.0, B_m: 0.25, aniso_lambda: 0.20}
    car_ped:  {A_mps2: 0.8, B_m: 0.25, aniso_lambda: 0.10}
  wiedemann:
    T_s: 1.5              # 期望时间车头距
    s0_m: 1.0             # 静止最小净距
    dv_th_mps: 0.2        # 速度差感知阈值
    t_react_s: 1.2
    k_gap_1ps: 0.6
    k_v_1ps: 1.0
    k_acc_1ps: 1.5        # 自由行驶时向期望速度收敛的增益
    ped: {T_s: 1.2, t_react_s: 1.0}
    car: {T_s: 1.5, t_react_s: 1.2}

# -----------------------------------------------------------------------------
# 指标 / 判定阈值
# -----------------------------------------------------------------------------
metrics:
  stop_speed_mps: 0.10        # 低速视为“停车”
  deadlock_speed_mps: 0.05    # 僵持判定速度
  deadlock_hold_s: 8.0        # 双方持续停止超过该时长 -> 僵持
  deadlock_window_m: 40.0     # 僵持判定时考虑的车前行人范围
  ped_finish_distance_m: 60.0 # 行人前进 60 m 视为通过
  passing_zone_m: 10.0         # 统计“擦身而过”横向余量时的人车纵向距离窗口



